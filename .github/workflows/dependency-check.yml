name: Laptop predictor dependency smoke checks

on:
  pull_request:
    branches: [main]
    paths:
      - requirements.txt
      - app.py
      - .github/workflows/dependency-check.yml

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install documented dependencies
        run: python -m pip install -r requirements.txt
      - name: Import dependency libraries (never load pickles)
        run: python -c "import streamlit, numpy, pandas, sklearn; print('Imports OK; saved model not loaded')"
      - name: Source syntax check (do not execute app)
        run: python -m compileall -q app.py
